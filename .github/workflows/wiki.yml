# Publishes docs/wiki/ to the repository's wiki, so wiki pages are written and reviewed in pull requests.
# Pages edited in the wiki itself are overwritten by the next run.
# The wiki must exist first: create any page once under the Wiki tab.
name: Wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Push docs/wiki to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki is up to date."; exit 0; fi
          git commit -m "Wiki from ${GITHUB_SHA::7}"
          git push
