# Deploys to Cloudflare Workers after every push to main, then checks the live site.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers")
# and CLOUDFLARE_ACCOUNT_ID. The app's own settings stay Cloudflare secrets; they're
# not needed here. The worker name comes from wrangler.toml.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Cheap insurance: never deploy a commit that doesn't pass.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uses the wrangler version from package.json.
          command: deploy

      # The database's tables (#161). After the deploy, which creates the database on the first
      # run; the app applies the same files on first use, so the order doesn't matter much.
      - name: Database schema
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh "${{ vars.APP_URL }}"

      # A release that doesn't pass the smoke test goes back to the one before (#191). The run
      # still fails, so the commit shows red. Migrations only ever add, so the older release
      # works with the newer schema.
      - name: Roll back
        if: failure() && steps.deploy.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: rollback --yes --message "Smoke test failed for ${{ github.sha }}"
