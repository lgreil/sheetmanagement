# Generic Cloudflare Workers config. Safe to commit: it contains no ids or secrets.
# Deployment-specific values (orchestra name, Google ids, keys) are set per
# deployment with `wrangler secret put <NAME>`; see .dev.vars.example for the list.
name = "noten"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_als"]

# Keep variables set in the Cloudflare dashboard when deploying.
keep_vars = true

# Cache for the Drive archive index. Wrangler creates the namespace on the first
# deploy and may write its id below; that id is not secret.
[[kv_namespaces]]
binding = "CACHE"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# Demo with invented sample data instead of Google, signed in as a demo user (#121).
# Locally: pnpm dev:demo. Deployed: pnpm build && pnpm wrangler deploy --env demo
# (a separate Worker, "noten-demo"; it needs no secrets). Bindings aren't inherited, so the
# demo runs without the KV cache, which it doesn't need.
[env.demo]
name = "noten-demo"
vars = { DEMO = "true", ORCHESTRA_NAME = "Musterorchester", ORCHESTRA_SHORT_NAME = "Muster", ORCHESTRA_LOGO = "/demo/musterorchester.svg", ORCHESTRA_ACCENT = "#2c5d8f" }
